name: Build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew check --console=plain

  native-image:
    name: dustc (${{ matrix.target }})
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x86_64
            os: ubuntu-latest
          - target: linux-aarch64
            os: ubuntu-24.04-arm
          - target: macos-aarch64
            os: macos-latest
          - target: windows-x86_64
            os: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: graalvm/setup-graalvm@v1
        with:
          distribution: graalvm-community
          java-version: "25"
          github-token: ${{ secrets.GITHUB_TOKEN }}
          native-image-job-reports: "true"
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew nativeCompile --console=plain
        shell: bash

      - name: Stage binary
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          if [ "$RUNNER_OS" = Windows ]; then
            built=build/native/nativeCompile/dustc.exe
            staged=dist/dustc-${{ matrix.target }}.exe
          else
            built=build/native/nativeCompile/dustc
            staged=dist/dustc-${{ matrix.target }}
          fi
          if [ ! -f "$built" ]; then
            echo "::error::native-image produced no executable at $built"
            ls -l build/native/nativeCompile
            exit 1
          fi
          cp "$built" "$staged"
          chmod +x "$staged"
          "$staged" --version

      - uses: actions/upload-artifact@v4
        with:
          name: dustc-${{ matrix.target }}
          path: dist/dustc-${{ matrix.target }}*
          if-no-files-found: error

  extension:
    name: VS Code extension
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Test extension
        working-directory: editors/vscode
        run: |
          npm ci
          npm test
      - name: Package extension
        working-directory: editors/vscode
        run: |
          mkdir -p "$GITHUB_WORKSPACE/dist"
          npx --yes @vscode/vsce package --out "$GITHUB_WORKSPACE/dist/dust-vscode.vsix"
      - uses: actions/upload-artifact@v4
        with:
          name: dust-vscode
          path: dist/dust-vscode.vsix
          if-no-files-found: error

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [native-image, extension]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Collect assets
        run: |
          set -euo pipefail
          mkdir -p release
          find artifacts -type f \( -name 'dustc-*' -o -name '*.vsix' \) -exec cp {} release/ \;
          ls -l release
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "dustc $GITHUB_REF_NAME" --generate-notes release/*

  nightly:
    name: Nightly prerelease
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && !github.event.repository.fork
    needs: [native-image, extension]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: nightly-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Collect assets
        run: |
          set -euo pipefail
          mkdir -p release
          find artifacts -type f \( -name 'dustc-*' -o -name '*.vsix' \) -exec cp {} release/ \;
          ls -l release
      - name: Refresh nightly prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$(cat dustc.version)"
          short="${GITHUB_SHA:0:7}"
          gh release delete nightly --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes || true
          gh release create nightly \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "dustc nightly ($version, $short)" \
            --notes "Rolling build of \`main\` at $GITHUB_SHA." \
            release/*
